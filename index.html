<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fridge Simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf3f5;--ink:#17303a;--dim:#6e8791;--teal:#2a7f8f;--line:#d3e0e4;--card:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:46px 18px 64px}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:36px}
.sub{color:var(--dim);font-size:13.5px;margin-top:5px}
#fridge{width:min(430px,92vw);margin:26px 0 18px;background:linear-gradient(105deg,#f7fafb,#dde7ea 60%,#cfdde1);border:1px solid #c3d3d8;border-radius:22px;padding:26px 22px 18px;position:relative;box-shadow:0 16px 34px rgba(23,48,58,.14)}
#fridge::before{content:"";position:absolute;left:12px;top:34px;bottom:34px;width:7px;border-radius:4px;background:linear-gradient(#b9c9ce,#9fb4ba)}
#inside{min-height:190px;background:linear-gradient(#ffffff,#eef6f8);border:1px solid var(--line);border-radius:14px;padding:18px;margin-left:14px;font-size:30px;line-height:1.7;box-shadow:inset 0 0 30px rgba(42,127,143,.08)}
#inside div{margin:2px 0}
#inside span{margin:0 3px}
#hud{display:flex;justify-content:space-between;margin:14px 0 0 14px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--teal);font-weight:700}
#row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#row button{cursor:pointer;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:all .15s}
#row button:hover{border-color:var(--teal);color:var(--teal)}
#add{background:var(--teal);border-color:var(--teal);color:#fff}
#add:hover{background:#226975;color:#fff}
#msg{margin-top:20px;font-style:italic;font-size:14px;color:var(--dim);max-width:480px;text-align:center;line-height:1.6}
#stats{margin-top:14px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim)}
#stats b{color:var(--teal);margin:0 3px}
</style>
</head>
<body>
<h1>Fridge Simulator</h1>
<div class="sub">you are the fridge. keep the food alive.</div>
<div id="fridge">
  <div id="inside"></div>
  <div id="hud"><span id="temp">TEMP 37°F</span><span id="light">LIGHT ON</span></div>
</div>
<div id="row">
  <button id="add">Stock groceries</button>
  <button id="door">Slam door</button>
  <button id="colder">Colder</button>
</div>
<div id="msg">a fridge hums. somewhere, a light debates its existence.</div>
<div id="stats">ITEMS <b id="n">0</b> &middot; FRESH <b id="fresh">0</b> &middot; LOST <b id="lost">0</b></div>
<script>
const ITEMS=[['🥛','milk'],['🥚','eggs'],['🧀','cheese'],['🥬','lettuce'],['🍗','chicken'],['🍓','berries'],['🥫','leftovers'],['🧈','butter'],['🍋','lemons'],['🥩','steak']];
const $=id=>document.getElementById(id);
const inside=$('inside');
let temp=37,light=true,lost=0,count=0;
const msgs=['a jar of pickles rolls judgmentally','the crisper drawer sticks, as is tradition','condensation forms. you are doing great','the butter compartment remains a mystery','something in the back predates the lease'];
function stock(){
  if(count>=12){$('msg').textContent='the fridge is full. physics says no.';return;}
  const [e,name]=ITEMS[Math.floor(Math.random()*ITEMS.length)];
  const d=document.createElement('div');d.className='item';d.textContent=e;
  d.dataset.fresh=100;d.dataset.name=name;
  d.onclick=()=>{const f=+d.dataset.fresh;
    $('msg').textContent=f>40?name+' inspected: still good ('+f+'% fresh)':name+' inspected: questionable ('+f+'% fresh). toss it? click again to toss.';
    if(f<=40){d.onclick=()=>{d.remove();count--;lost++;$('msg').textContent=name+' discarded with ceremony.';hud();};}};
  inside.appendChild(d);count++;
  $('msg').textContent=name+' stocked. the door shelf shifts to accommodate.';
  hud();
}
function hud(){
  $('n').textContent=count;$('lost').textContent=lost;
  $('temp').textContent='TEMP '+temp+'°F';
  $('light').textContent=light?'LIGHT ON':'LIGHT OFF';
  let f=0;[...inside.children].forEach(c=>f+=+c.dataset.fresh);
  $('fresh').textContent=count?Math.round(f/count)+'%':'-';
}
$('add').onclick=stock;
$('door').onclick=()=>{light=!light;inside.classList.toggle('off',!light);$('msg').textContent=light?'the light returns. no one claps.':'darkness. the yogurts grow bolder.';hud();};
$('colder').onclick=()=>{temp=Math.max(28,temp-2);$('msg').textContent=temp<=30?'everything is slightly frozen now, including the milk. oops.':'compressor hums harder.';hud();};
setInterval(()=>{
  const decay=temp<=33?0.4:temp<=38?1:2.5;
  [...inside.children].forEach(c=>{
    let f=Math.max(0,+c.dataset.fresh-decay);
    c.dataset.fresh=Math.round(f);
    if(f<=40&&!c.querySelector('.spoil')){const s=document.createElement('span');s.className='spoil';s.textContent='❄';c.appendChild(s);}
    if(f<=0&&Math.random()<.3){c.remove();count--;lost++;}
  });
  if(Math.random()<.4)$('msg').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  hud();
},2000);
for(let i=0;i<5;i++)stock();
</script>
</body>
</html>
